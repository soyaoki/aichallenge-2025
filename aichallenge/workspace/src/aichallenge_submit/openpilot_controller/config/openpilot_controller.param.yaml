/**:
  ros__parameters:
    model:
      # Filled in by launch/openpilot.launch.xml.
      path: ""
      # SHA-256 of commaai/openpilot @ 084747c7
      # openpilot/selfdrive/modeld/models/driving_supercombo.onnx.
      # The model's output_slices metadata is a pickle, so the file is verified
      # before it is loaded. Clear this only for a locally built model.
      sha256: "659727c4d4839adc4992a254409a54259a8756a743f2d567bf5fdc6579f8009b"
      # auto | cpu | cuda | tensorrt. `auto` prefers TensorRT, then CUDA, then CPU,
      # using whatever the installed onnxruntime build actually offers.
      provider: "auto"
      # 0 keeps the onnxruntime default.
      intra_op_threads: 0

    camera:
      # Prefer /camera_info; hfov_deg is the fallback until the first message arrives.
      use_camera_info: true
      hfov_deg: 60.0
      # device-from-calibrated-frame euler angles [rad]: mounting offset of the
      # camera relative to the direction of travel. Tune pitch first.
      calib_roll: 0.0
      calib_pitch: 0.0
      calib_yaw: 0.0
      # Camera height above the road [m]; racing_kart_sensor_kit puts camera_link
      # at z=0.7. Only used to drop the predicted path onto the road in the debug
      # image, the way openpilot's own renderer does.
      height: 0.7
      # Estimate calib_pitch / calib_yaw while driving straight, from the ego motion
      # the model predicts, the way openpilot's calibrationd does. The calib_* values
      # above are the starting point. Needs ~500 straight, fast frames to converge.
      auto_calibration: true
      calibration_min_speed: 3.0
      # openpilot's 2 deg/s assumes highway straights; a kart circuit is almost all
      # corners and nothing qualifies. Relaxing it lets an estimate form, but turning
      # frames bias it.
      calibration_max_yaw_rate_deg: 2.0
      # Written once converged and read back at startup, so a calibration run
      # (another controller drives, this node only observes) carries over.
      # Set to "" to disable persistence.
      calibration_file: "/aichallenge/calibration/openpilot_calibration.yaml"

    output:
      # direct_action: publish AckermannControlCommand from the model's action.
      # trajectory   : publish the predicted plan as an Autoware Trajectory and let
      #                one of the challenge controllers follow it.
      mode: "direct_action"
      frame_id: "base_link"
      # Predicted path / lane lines / road edges for RViz. Look at these first.
      publish_markers: true
      # Same prediction drawn back onto an image, on /openpilot/debug/image.
      publish_debug_image: true
      # model_input: the warped 512x256 frame the network is actually fed, which is
      #   where a wrong camera FOV or mounting pitch shows up first.
      # camera: the untouched camera image with the prediction projected onto it.
      debug_image_source: "model_input"
      debug_image_scale: 2
      # The debug image costs more than the inference does (two warps, the drawing
      # and a 1.5 MB message), and it shares a thread with inference, so publishing
      # it every frame drags the whole pipeline down. Every 5th is enough to watch.
      debug_image_decimation: 5

    # comma's device frame is x->forward, y->right, z->down; base_link is
    # x->forward, y->left, z->up. Confirm against a real drive before trusting it.
    frame:
      swap_xy: false
      invert_x: false
      invert_y: true
      invert_z: true

    control:
      # Phase 1 is observation only: watch the predicted path in RViz before
      # letting the model drive. Set to true to publish control commands.
      enabled: false
      publish_rate_hz: 20.0
      command_timeout_sec: 0.5
      timeout_deceleration: -2.0
      # AWSIM tracks longitudinal.speed, and the model reports shouldStop at a
      # standstill (its training data has a driver pressing the gas to depart), so
      # the requested speed would stay at zero and pin the kart at the start line.
      # Below launch_speed we pull away ourselves; set launch_speed to 0 to let the
      # model decide from a stop.
      launch_speed: 3.0
      launch_acceleration: 1.5
      # Actuator delays the model plans for [s].
      lat_delay: 0.2
      long_delay: 0.2
      lat_smooth_seconds: 0.0
      long_smooth_seconds: 0.3
      # Safety envelope on top of the model output. openpilot's own numbers are
      # road-car limits (0.2 / 5.0 / 3.0) and clip a kart to less than half of what
      # it can physically do: with wheel_base 1.087 m and 0.442 rad of steering the
      # kinematic limit is tan(0.442)/1.087 = 0.44 1/m.
      apply_curvature_limits: true
      max_curvature: 0.44
      max_lateral_jerk: 20.0
      max_lateral_accel: 8.0
      max_acceleration: 2.0
      max_deceleration: -4.0
      max_speed: 30.0
      # Japan drives on the left, i.e. right-hand drive.
      is_rhd: true

    vehicle:
      wheel_base: 1.087
      max_steering_tire_angle: 0.442
      # simple_pure_pursuit applies 1.5 against AWSIM (1.639 on the real kart); the
      # bicycle-model angle on its own under-steers by that factor.
      steering_tire_angle_gain: 1.5

    log_interval_sec: 5.0
    debug: false
